services:

  # ── OpenClaw Gateway ────────────────────────────────────────────────────────
  # Agent IA local (MIT) — https://github.com/openclaw/openclaw
  # Accès dashboard : http://localhost:18789
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    container_name: burinfort-openclaw
    restart: unless-stopped
    init: true
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    environment:
      ANTHROPIC_API_KEY:      ${ANTHROPIC_API_KEY}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-changeme}
      TZ: Europe/Paris
    volumes:
      - openclaw-state:/home/node/.openclaw
      - ../openclaw-skills:/home/node/.openclaw/workspace/skills:ro
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:18789/health 2>/dev/null || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── BOAMP Cron ──────────────────────────────────────────────────────────────
  # Récupère et affiche les appels d'offres BOAMP toutes les 24h (sans archivage)
  boamp-cron:
    image: python:3.12-slim
    container_name: burinfort-boamp-cron
    restart: unless-stopped
    environment:
      BOAMP_KEYWORDS:    "informatique OR logiciel OR GED OR numérique OR DSI"
      BOAMP_ROWS:        "20"
      CRON_MODE:         "true"
    volumes:
      - ../openclaw-skills:/skills:ro
    command: >
      sh -c "echo 'BOAMP Cron démarré — affichage toutes les 24h (sans archivage)' &&
             while true; do
               echo \"[$(date '+%Y-%m-%d %H:%M')] Récupération des appels d'offres...\" &&
               python /skills/fetch-boamp.py ;
               sleep 86400;
             done"

  # ── Marchés CI Cron ─────────────────────────────────────────────────────────
  # Scrape les portails ivoiriens (marchespublics.ci, anrmp.ci) toutes les 24h
  # et met à jour le cache JSON dans Alfresco GED.
  ci-cron:
    image: python:3.12-slim
    container_name: burinfort-ci-cron
    restart: unless-stopped
    environment:
      ALFRESCO_URL:     "${ALFRESCO_URL:-http://alfresco:8080/alfresco}"
      ALFRESCO_USER:    "${ALFRESCO_USER:-admin}"
      ALFRESCO_PASS:    "${ALFRESCO_PASS:-${ALFRESCO_ADMIN_PASSWORD:-admin}}"
      CI_ROWS:          "30"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      SMTP_HOST:        "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT:        "${SMTP_PORT:-587}"
      SMTP_USER:        "${SMTP_USER:-${MAIL_USERNAME:-}}"
      SMTP_PASS:        "${SMTP_PASS:-${MAIL_PASSWORD:-}}"
      ALERT_TO:         "${ALERT_TO:-}"
      ALERT_FROM:       "${ALERT_FROM:-}"
    volumes:
      - ../openclaw-skills:/skills:ro
    networks:
      - alfresco-net
    command: >
      sh -c "pip install --quiet beautifulsoup4 requests pdfminer.six &&
             echo 'Marchés CI Cron démarré — scraping toutes les 24h' &&
             while true; do
               echo \"[$(date '+%Y-%m-%d %H:%M')] Scraping marchés publics CI...\" &&
               python -I /skills/fetch-ci-marches.py ;
               sleep 86400;
             done"

volumes:
  openclaw-state:
    name: burinfort-ged-openclaw-state

networks:
  alfresco-net:
    external: true
    name: compose_default
