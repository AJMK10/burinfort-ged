server {
    listen 80;
    server_name ged.burinfort.com www.ged.burinfort.com;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ged.burinfort.com;

    # ─── SSL (Let's Encrypt via aaPanel) ──────────────────────────────────────
    ssl_certificate     /www/server/panel/vhost/cert/ged.burinfort.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/ged.burinfort.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ─── Logs ─────────────────────────────────────────────────────────────────
    access_log /www/wwwlogs/ged.burinfort.com.log;
    error_log  /www/wwwlogs/ged.burinfort.com.error.log;

    # ─── Taille maximale des uploads ──────────────────────────────────────────
    client_max_body_size 500m;

    # ─── Timeouts longs pour Alfresco ─────────────────────────────────────────
    proxy_connect_timeout    300s;
    proxy_send_timeout       300s;
    proxy_read_timeout       300s;

    # ─── Proxy vers l'application Docker ──────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8085;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Désactiver la mise en buffer pour les gros fichiers
        proxy_buffering    off;
        proxy_request_buffering off;
    }

    # ─── Sécurité ─────────────────────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy no-referrer-when-downgrade;
}
